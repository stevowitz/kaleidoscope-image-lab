.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {

  height: 20px;

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

    [aria-selected=&quot;true&quot;],

  ) {

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;body&gt;
&lt;div id=&quot;kaleidoscope-image-lab&quot; class=&quot;kaleido-shell&quot;&gt;
  &lt;style&gt;
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Outfit:wght@400;500;600;700&amp;display=swap');

    /* Optical Instrument redesign */
    #kaleidoscope-image-lab {
      --kaleido-background: #0d1014;
      --kaleido-panel: rgb(18 24 31 / 0.9);
      --kaleido-panel-raised: #1a222c;
      --kaleido-text: #e6efee;
      --kaleido-muted: #91a0a3;
      --kaleido-border: #2b3741;
      --kaleido-accent: #67e2ce;
      --kaleido-accent-ink: #071815;
      --kaleido-spectrum: #ffb45c;
      --kaleido-danger: #ff7d8a;
      --kaleido-radius: 16px;
      --kaleido-shadow: 0 28px 70px rgb(0 0 0 / 0.34);
      position: relative;
      isolation: isolate;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      min-height: 100dvh;
      padding: 10px;
      overflow-x: hidden;
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(circle at 16% 8%, rgb(58 110 126 / 0.16), transparent 26rem),
        radial-gradient(circle at 82% 86%, rgb(131 70 128 / 0.11), transparent 30rem),
        linear-gradient(145deg, #0b0e12 0%, var(--kaleido-background) 48%, #0b1016 100%);
      font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
    }

    #kaleidoscope-image-lab::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.22;
      background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 180 180%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%221.15%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23n)%22 opacity=%22.16%22/%3E%3C/svg%3E');
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    #kaleidoscope-image-lab .kaleido-appbar {
      grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
      gap: 18px;
      min-height: 62px;
      padding: 8px 10px 8px 18px;
      border-color: rgb(116 145 151 / 0.2);
      border-radius: 18px;
      background: linear-gradient(135deg, rgb(22 29 37 / 0.94), rgb(15 20 26 / 0.88));
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.035);
      backdrop-filter: blur(18px);
    }

    #kaleidoscope-image-lab .kaleido-brand {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        'mark name'
        'mark subtitle'
        'mark marquee';
      gap: 0 10px;
      align-items: center;
    }

    #kaleidoscope-image-lab .kaleido-brand-aperture {
      grid-area: mark;
      width: 64px;
      height: 64px;

    #kaleidoscope-image-lab .kaleido-brand-name {
      grid-area: name;
      max-inline-size: 72rem;
      color: var(--kaleido-text);
      font-size: clamp(16px, 1.4vw, 20px);
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.05;
      text-wrap: balance;
    }

    #kaleidoscope-image-lab .kaleido-brand-subtitle {
      grid-area: subtitle;
      margin-top: 2px;
      color: #aebbbc;
      font-size: 11px;
      letter-spacing: 0.015em;
    }

    #kaleidoscope-image-lab .kaleido-optics-marquee {
      grid-area: marquee;
      width: min(100%, 285px);
      margin-top: 3px;
      overflow: hidden;
      color: #68777b;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 8px;
      letter-spacing: 0.12em;
      line-height: 1;
      text-transform: uppercase;
      white-space: nowrap;
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    #kaleidoscope-image-lab .kaleido-optics-marquee-track {
      display: inline-flex;
      gap: 18px;
      min-width: max-content;
      animation: kaleido-optics-marquee 24s linear infinite;
    }

    #kaleidoscope-image-lab .kaleido-optics-marquee-track span::after {
      content: '·';
      margin-left: 18px;
      color: var(--kaleido-accent);
    }

    @keyframes kaleido-optics-marquee {
      to { transform: translateX(-50%); }
    }

    #kaleidoscope-image-lab .kaleido-app-actions {
      flex-wrap: nowrap;
    }

    #kaleidoscope-image-lab .kaleido-file-button,
    #kaleidoscope-image-lab .btn {
      min-height: 34px;
      padding: 7px 10px;
      border-color: rgb(108 131 136 / 0.25);
      border-radius: 10px;
      background: linear-gradient(180deg, rgb(38 49 60 / 0.9), rgb(27 35 44 / 0.92));
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.04);
      font-size: 12px;
      font-weight: 500;
      transition:
        transform 240ms cubic-bezier(.2, .8, .2, 1),
        border-color 180ms ease,
        background-color 180ms ease,
        color 180ms ease;
    }

    #kaleidoscope-image-lab .kaleido-file-button:hover,
    #kaleidoscope-image-lab .btn:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.018);
      border-color: rgb(103 226 206 / 0.52);
      background: linear-gradient(180deg, #26333d, #202a33);
    }

    #kaleidoscope-image-lab .btn-primary,
    #kaleidoscope-image-lab .btn[aria-pressed='true'] {
      border-color: var(--kaleido-accent);
      color: var(--kaleido-accent-ink);
      background: linear-gradient(135deg, #83efdd, var(--kaleido-accent));
      box-shadow: 0 8px 24px rgb(103 226 206 / 0.14), inset 0 1px 0 rgb(255 255 255 / 0.35);
    }

    #kaleidoscope-image-lab #kaleido-export {
      padding-inline: 16px;
      color: #071815;
      background: linear-gradient(135deg, #a2f5e8 0%, #67e2ce 62%, #65cdbf 100%);
      border-color: transparent;
      font-weight: 650;
    }

    #kaleidoscope-image-lab .kaleido-workspace {
      grid-auto-flow: dense;
      grid-template-columns: 88px minmax(0, 1fr) clamp(310px, 26vw, 380px);
      gap: 10px;
    }

    #kaleidoscope-image-lab .kaleido-workspace-rail {
      gap: 5px;
      padding: 8px;
      border-color: rgb(116 145 151 / 0.18);
      border-radius: 18px;
      background: linear-gradient(180deg, rgb(20 27 34 / 0.94), rgb(14 19 25 / 0.9));
      box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.025);
    }

    #kaleidoscope-image-lab .kaleido-workspace-tab {
      grid-template-columns: 1fr;
      gap: 5px;
      min-height: 62px;
      padding: 8px 5px;
      border-radius: 12px;
      font-size: 10px;
      letter-spacing: 0.025em;
      transition:
        transform 250ms cubic-bezier(.2, .8, .2, 1),
        background-color 180ms ease,
        color 180ms ease;
    }

    #kaleidoscope-image-lab .kaleido-workspace-tab svg {
      width: 17px;
      height: 17px;
      stroke-width: 1.6;
    }

    #kaleidoscope-image-lab .kaleido-workspace-tab:hover {
      transform: translateX(2px) scale(1.025);
      background: rgb(103 226 206 / 0.06);
    }

    #kaleidoscope-image-lab .kaleido-workspace-tab[aria-selected='true'] {
      border-color: rgb(103 226 206 / 0.52);
      color: var(--kaleido-text);
      background:
        radial-gradient(circle at 50% 0%, rgb(103 226 206 / 0.17), transparent 70%),
        #182128;
      box-shadow: inset 3px 0 0 var(--kaleido-accent), 0 10px 28px rgb(0 0 0 / 0.2);
    }

    #kaleidoscope-image-lab .kaleido-preview-workspace {
      position: relative;
      overflow: visible;
      padding: 0;
      border: 0;
      border-radius: 22px;
      background:
        radial-gradient(circle at center, rgb(35 53 62 / 0.65), transparent 66%),
        rgb(6 9 13 / 0.48);
      box-shadow: inset 0 0 0 1px rgb(122 151 157 / 0.12);
    }

    #kaleidoscope-image-lab .kaleido-preview-stage {
      position: relative;
      height: 100%;
      gap: 0;
      padding: 58px 24px 20px;
    }

    #kaleidoscope-image-lab .kaleido-preview-tools {
      position: absolute;
      z-index: 8;
      top: 12px;
      left: 50%;
      flex-wrap: nowrap;
      padding: 5px;
      border: 1px solid rgb(111 137 142 / 0.2);
      border-radius: 13px;
      background: rgb(15 21 27 / 0.76);
      box-shadow: 0 12px 32px rgb(0 0 0 / 0.2), inset 0 1px 0 rgb(255 255 255 / 0.04);
      backdrop-filter: blur(16px);
      transform: translateX(-50%);
    }

    #kaleidoscope-image-lab .kaleido-preview-tools .btn,
    #kaleidoscope-image-lab .kaleido-preview-tools .kaleido-select {
      min-height: 30px;
      border-color: transparent;
      background-color: transparent;
      box-shadow: none;
      font-size: 11px;
    }

    #kaleidoscope-image-lab .kaleido-canvas-wrap {
      --kaleido-segment-angle: 180deg;
      --kaleido-ring-rotation: 0deg;
      width: min(100%, 860px, calc(100dvh - 116px));
      border-color: rgb(155 187 190 / 0.26);
      border-radius: 20px;
      box-shadow:
        0 34px 90px rgb(0 0 0 / 0.45),
        0 0 0 8px rgb(10 15 20 / 0.82),
        0 0 0 9px rgb(115 151 156 / 0.14);
      will-change: transform, opacity;
    }

    #kaleidoscope-image-lab .kaleido-canvas-wrap::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 5;
      padding: 2px;

      }

        animation: none;

  function wrapDegrees(value) {

  function getRenderableState() {
    const baseState = getState();
    if (animationPlaybackState === &#x27;stopped&#x27;) return baseState;
    const animation = baseState.animation || defaultAnimation;
    const next = {
      ...baseState,
      polar: { ...(baseState.polar || defaultPolar) },
      crystal: { ...(baseState.crystal || defaultCrystal) },
      pattern: { ...(baseState.pattern || defaultPattern) }
    };
    const globalSpeed = animation.speedMultiplier;
    const organic = animation.organic || defaultOrganicMotion;

  function getSupportedRecordingMimeType() {

      &#x27;video/webm;codecs=vp9&#x27;,
      &#x27;video/webm;codecs=vp8&#x27;,
      &#x27;video/webm&#x27;,
      &#x27;video/mp4;codecs=avc1.42E01E&#x27;,
      &#x27;video/mp4&#x27;

    return candidates.find((candidate) =&gt; MediaRecorder.isTypeSupported(candidate)) || &#x27;&#x27;;

    recordingStatus.textContent = message;
    recordingStatus.dataset.state = state;
  }

  function updateRecordingUi() {
    const isRecording = recordingRecorder?.state === &#x27;recording&#x27;;
    recordingStartButton.disabled = isRecording;
    recordingStopButton.disabled = !isRecording;
  }

  function releaseRecordingStream() {
    recordingStream?.getTracks().forEach((track) =&gt; track.stop());

  }

  function finishRecording(recorder) {
    const mimeType = recorder.mimeType || getSupportedRecordingMimeType() || &#x27;video/webm&#x27;;
    const blob = new Blob(recordingChunks, { type: mimeType });

    recordingRecorder = null;
    updateRecordingUi();

    }

    const objectUrl = URL.createObjectURL(blob);

  function createEffectId() {

      type,
      enabled: true,
      settings: definition.normalize({ ...definition.defaults, ...settings })

  function normalizeEffectStack(nextStack) {
    return (Array.isArray(nextStack) ? nextStack : []).map((entry) =&gt; {
      const definition = effectDefinitions[entry?.type];
      if (!definition) return null;
      const id = String(entry.id || createEffectId());
      const idNumber = Number(id.replace(/^effect-/, ''));
      if (Number.isFinite(idNumber)) effectInstanceCounter = Math.max(effectInstanceCounter, idNumber);
      return {

        type: entry.type,
        enabled: entry.enabled !== false,
        settings: definition.normalize({ ...definition.defaults, ...(entry.settings || {}) })

  function migrateLegacyEffects(nextEffects) {

    const migrated = [];
    const addIfActive = (type, settings, active) =&gt; {
      if (active) migrated.push(createEffectEntry(type, settings));
    };
    addIfActive('brightness', { amount: effects.brightness }, Number(effects.brightness) !== 0);
    addIfActive('contrast', { amount: effects.contrast }, Number(effects.contrast) !== 0);
    addIfActive('saturation', { amount: effects.saturation }, Number(effects.saturation) !== 0);
    addIfActive('monochrome', { enabled: true }, Boolean(effects.monochrome));
    addIfActive('vignette', { amount: effects.vignette }, Number(effects.vignette) !== 0);
    addIfActive('glow', { amount: effects.glow }, Number(effects.glow) !== 0);
    addIfActive('grain', { amount: effects.grain }, Number(effects.grain) !== 0);

  function getEffectState() {

      enabled: entry.enabled,

  function makeEffectButton(label, handler, title = '') {

  function beginEffectEdit(id) {

  function updateEffectSetting(entry, control, value) {

  function renderEffectStack() {
    if (!effectStackElement) return;

      header.className = 'kaleido-effect-entry-header';
      const title = document.createElement('div');

  function drawSoftPaintingDab(context, point, stroke) {

  function drawPaintingSegment(context, first, second, stroke) {

  function validatePresetLibrary() {

    ];
    const ids = new Set();
    presets.forEach((preset, index) =&gt; {

        throw new Error(`Invalid preset metadata at index ${index}.`);

      if (ids.has(preset.id)) throw new Error(`Duplicate preset id: ${preset.id}`);
      ids.add(preset.id);

  function getNavigatorImageRect() {

  function drawNavigatorMarker(x, y, color, radial = false) {

  const proceduralGeneratorIntensities = Object.freeze({
    gentle: { label: &#x27;Gentle&#x27;, systemFactor: 0.72, offsetFactor: 0.62, variation: 0.18, effectCount: 1, patternOpacity: [38, 64] },

  function proceduralSigned(reach) {
    return randomRange(-reach, reach, 0);
  }

  function chooseProceduralGeometry(profile) {
    return weightedRandom(geometryManager.list(), (geometry) =&gt; {
      const index = profile.geometryPreference.indexOf(geometry.id);
      return index &lt; 0 ? 1 : profile.geometryPreference.length - index;
    }).id;
  }

  function chooseProceduralPattern(profile, intensity, palette) {
    const choice = randomFrom(profile.patternChoices);
    const pack = patternPacks[choice.packId];
    const patternId = randomFrom(choice.patternIds.filter((id) =&gt; pack?.patterns[id]) || []);
    const definition = pack?.patterns[patternId] || patternPacks[defaultPattern.packId].patterns[defaultPattern.patternId];
    const pattern = {
      ...defaultPattern,
      enabled: true,
      packId: pack ? choice.packId : defaultPattern.packId,
      patternId: definition.id,
      useMode: randomFrom(profile.patternModes),
      scale: Number(randomRange(0.58, intensity === proceduralGeneratorIntensities.dramatic ? 1.12 : 0.94, 2).toFixed(2)),
      rotation: randomFrom([-90, -45, 0, 45, 90, 135]),
      centerX: proceduralSigned(22 * intensity.offsetFactor),
      centerY: proceduralSigned(22 * intensity.offsetFactor),
      lineWidth: randomRange(2, intensity === proceduralGeneratorIntensities.dramatic ? 7 : 4),
      lineColor: palette.line,
      opacity: randomRange(intensity.patternOpacity[0], intensity.patternOpacity[1])
    };
    const definitions = definition.parameterDefinitions || [];
    definitions.slice(0, intensity === proceduralGeneratorIntensities.dramatic ? 3 : 2).forEach((parameter) =&gt; {
      if (parameter.options) {
        pattern[parameter.key] = Number(randomFrom(parameter.options).value);
        return;
      }
      const minimum = Number(parameter.min);
      const maximum = Number(parameter.max);
      const fallback = Number(parameter.default);
      if (![minimum, maximum, fallback].every(Number.isFinite)) return;
      const spread = (maximum - minimum) * intensity.variation;
      const value = clamp(fallback + proceduralSigned(spread), minimum, maximum);
      const step = Number(parameter.step) || 1;
      pattern[parameter.key] = step &lt; 1 ? Number(value.toFixed(2)) : Math.round(value / step) * step;
    });
    return pattern;
  }

  function createProceduralEffectStack(profile, intensity, palette) {
    const types = [];
    const desiredCount = Math.min(3, intensity.effectCount + (profile === proceduralGeneratorProfiles.psychedelic || profile === proceduralGeneratorProfiles.bold ? 1 : 0));
    while (types.length &lt; desiredCount &amp;&amp; types.length &lt; profile.effectTypes.length) {
      const type = randomFrom(profile.effectTypes);
      if (!types.includes(type)) types.push(type);
    }
    return types.map((type) =&gt; {
      if (type === &#x27;gradientMap&#x27;) return createEffectEntry(type, { colorA: palette.shadow, colorB: palette.highlight });
      if (type === &#x27;brightness&#x27;) return createEffectEntry(type, { amount: randomRange(-18, 26) });
      if (type === &#x27;contrast&#x27;) return createEffectEntry(type, { amount: randomRange(12, 48) });
      if (type === &#x27;saturation&#x27;) return createEffectEntry(type, { amount: randomRange(16, 66) });
      if (type === &#x27;vignette&#x27;) return createEffectEntry(type, { amount: randomRange(16, 48) });
      if (type === &#x27;glow&#x27;) return createEffectEntry(type, { amount: randomRange(18, 58) });
      if (type === &#x27;grain&#x27;) return createEffectEntry(type, { amount: randomRange(4, 22) });
      return createEffectEntry(type);
    }).filter(Boolean);

  function createProceduralPresetState(startState, categoryId, intensityId, includes) {
    const profile = proceduralGeneratorProfiles[categoryId] || proceduralGeneratorProfiles.balanced;
    const intensity = proceduralGeneratorIntensities[intensityId] || proceduralGeneratorIntensities.balanced;
    const palette = profile.palette;
    const next = {
      ...startState,
      geometryId: chooseProceduralGeometry(profile),
      renderMode: randomFrom(profile.renderModes),
      segments: randomFrom(profile.segments),
      rotation: randomFrom([-135, -90, -45, 0, 0, 45, 90, 135]),
      zoom: Number(randomRange(profile.zoom[0], profile.zoom[1], 2).toFixed(2)),

    if (next.renderMode === &#x27;radial&#x27;) {
      next.mode = &#x27;alternating&#x27;;
    } else {
      next.centerX = 0;
      next.centerY = 0;
    }
    if (includes.pattern) {
      next.pattern = Math.random() &lt; Math.min(1, profile.systemChance.pattern * intensity.systemFactor)
        ? chooseProceduralPattern(profile, intensity, palette)
        : { ...defaultPattern };
    }
    if (includes.polar) {
      const polarMode = Math.random() &lt; Math.min(1, profile.systemChance.polar * intensity.systemFactor)
        ? randomFrom(profile.polarModes.filter((value) =&gt; value !== &#x27;off&#x27;))

      next.polar = {
        ...defaultPolar,
        mode: polarMode,
        centerX: proceduralSigned(18 * intensity.offsetFactor),
        centerY: proceduralSigned(18 * intensity.offsetFactor),
        rotation: randomFrom([-90, -45, 0, 45, 90]),

        scale: Number(randomRange(0.72, 1.38, 2).toFixed(2)),
        repeatCount: randomRange(4, 12),
        direction: Math.random() &lt; 0.5 ? -1 : 1
      };
    }
    if (includes.crystal) {
      const crystalMode = Math.random() &lt; Math.min(1, profile.systemChance.crystal * intensity.systemFactor)
        ? randomFrom(profile.crystalModes.filter((value) =&gt; value !== &#x27;off&#x27;))

      next.crystal = {
        ...defaultCrystal,
        mode: crystalMode,
        facetSize: randomRange(24, 72),
        rotation: randomFrom([-90, -45, 0, 45, 90]),
        strength: randomRange(38, intensity === proceduralGeneratorIntensities.dramatic ? 86 : 68),
        spread: randomRange(18, intensity === proceduralGeneratorIntensities.dramatic ? 72 : 54),
        direction: Math.random() &lt; 0.5 ? -1 : 1,
        reflection: Math.random() &gt; 0.18
      };
    }
    if (includes.effects) {
      next.effectStack = Math.random() &lt; Math.min(1, profile.systemChance.effects * intensity.systemFactor)
        ? createProceduralEffectStack(profile, intensity, palette)
        : [];
    }
    const normalized = normalizePresetSettings(next);
    normalized.polar = next.polar || normalized.polar;
    normalized.pattern = next.pattern || normalized.pattern;
    normalized.animation = next.animation || normalized.animation;
    return normalized;
  }

    const categoryId = proceduralGeneratorProfiles[generatorCategoryInput.value] ? generatorCategoryInput.value : &#x27;balanced&#x27;;

      const title = document.createElement(&#x27;span&#x27;);
      title.className = &#x27;kaleido-discovery-card-title&#x27;;

    discoveryCandidates = [];
    discoveryStatus.textContent = message;
    renderDiscoveryBatch();
  }

  function generateDiscoveryBatch() {
    if (!hasActiveSource()) return;
    const flavorId = discoveryFlavorProfiles[discoveryFlavorInput.value] ? discoveryFlavorInput.value : &#x27;balanced&#x27;;
    const baseState = getState();
    const generatedCandidates = [];
    for (let index = 0; index &lt; discoveryBatchSize; index += 1) {
      const recipe = getDiscoveryRecipe(flavorId, index);
      const state = createProceduralPresetState(baseState, recipe.categoryId, recipe.intensityId, {
        pattern: true,
        polar: true,
        crystal: true,
        effects: true
      });
      if (statesMatch(state, baseState) || generatedCandidates.some((candidate) =&gt; statesMatch(candidate.state, state))) {
        const fallbackRotations = [-135, -90, -45, 0, 45, 90, 135];
        const usedRotations = [baseState.rotation, ...generatedCandidates.map((candidate) =&gt; candidate.state.rotation)];
        state.rotation = fallbackRotations.find((value) =&gt; !usedRotations.includes(value)) ?? fallbackRotations[index % fallbackRotations.length];
      }
      generatedCandidates.push({
        name: `Candidate ${index + 1}`,
        flavor: proceduralGeneratorProfiles[recipe.categoryId].label,
        intensity: proceduralGeneratorIntensities[recipe.intensityId].label,
        state,
        thumbnail: createDiscoveryThumbnail(state)
      });
    }
    discoveryCandidates = generatedCandidates;
    renderDiscoveryBatch();
    discoveryStatus.textContent = `${discoveryBatchSize} ${discoveryFlavorProfiles[flavorId].label.toLowerCase()} directions ready. The current composition is unchanged.`;
  }

  function applyDiscoveryCandidate(index) {
    const candidate = discoveryCandidates[index];
    if (!candidate) return;
    const startState = getState();
    stopAnimation();
    presetSelect.value = &#x27;&#x27;;
    applyState(candidate.state);
    commitIfChanged(startState);
    discoveryStatus.textContent = `${candidate.name} applied. Save it from Favorites when ready.`;
    updateFavoritesAvailability();
  }

  function handleDiscoveryAction(event) {
    const button = event.target.closest(&#x27;[data-discovery-action]&#x27;);
    if (!button || !discoveryBatch.contains(button)) return;
    if (button.dataset.discoveryAction === &#x27;apply&#x27;) {
      applyDiscoveryCandidate(Number(button.closest(&#x27;[data-discovery-index]&#x27;)?.dataset.discoveryIndex));
    }
  }

  function createSourceData(maxSourceSide) {
    const sourceWidth = sourceImage.width || sourceImage.naturalWidth;
    const sourceHeight = sourceImage.height || sourceImage.naturalHeight;
    const scale = maxSourceSide ? Math.min(1, maxSourceSide / Math.max(sourceWidth, sourceHeight)) : 1;
    const drawWidth = Math.max(1, Math.round(sourceWidth * scale));
    const drawHeight = Math.max(1, Math.round(sourceHeight * scale));
    const swapsSides = Math.abs(importRotation) % 180 === 90;
    const sourceCanvas = document.createElement(&#x27;canvas&#x27;);
    sourceCanvas.width = swapsSides ? drawHeight : drawWidth;
    sourceCanvas.height = swapsSides ? drawWidth : drawHeight;
    const sourceCtx = sourceCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });
    sourceCtx.save();
    if (importRotation === -90) {
      sourceCtx.translate(0, sourceCanvas.height);
      sourceCtx.rotate(-Math.PI / 2);
      sourceCtx.drawImage(sourceImage, 0, 0, drawWidth, drawHeight);
    } else if (importRotation === 90) {
      sourceCtx.translate(sourceCanvas.width, 0);
      sourceCtx.rotate(Math.PI / 2);
      sourceCtx.drawImage(sourceImage, 0, 0, drawWidth, drawHeight);
    } else {
      sourceCtx.drawImage(sourceImage, 0, 0, drawWidth, drawHeight);
    }
    sourceCtx.restore();
    return {
      canvas: sourceCanvas,
      pixels: sourceCtx.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height).data,
      width: sourceCanvas.width,
      height: sourceCanvas.height
    };
  }

  function drawCoverImage() {
    importedPreviewSource = createSourceData(previewSourceLimit);
    if (!paintingMode) previewSource = importedPreviewSource;
  }

  function getExportSourceData() {
    if (paintingMode &amp;&amp; paintingSource) {
      syncPaintingPixels();
      return { ...paintingSource, ownsCanvas: false };
    }
    return { ...createSourceData(null), ownsCanvas: true };
  }

  function getRadialCenter(width, height, settings = getState()) {
    return {
      x: width * (0.5 + settings.centerX / 200),
      y: height * (0.5 + settings.centerY / 200)
    };
  }

  function getRadialMaxRadius(center, width, height) {
    return Math.max(
      Math.hypot(center.x, center.y),
      Math.hypot(width - center.x, center.y),
      Math.hypot(center.x, height - center.y),
      Math.hypot(width - center.x, height - center.y)
    );
  }

  function getMappedPoint(x, y, width, height) {
    return geometryManager.mapPoint(x, y, width, height, getState());
  }

  function getGeometryCenter(width, height, settings) {
    return settings.renderMode === &#x27;radial&#x27;
      ? getRadialCenter(width, height, settings)
      : { x: width / 2, y: height / 2 };
  }

  function isOutsideGeometryCrop(x, y, plan, settings) {
    if (!settings.circularCrop) return false;
    return Math.hypot(x - plan.center.x, y - plan.center.y) &gt; Math.min(plan.width, plan.height) / 2;
  }

  function setPolarMapping(output, radius, angle, alpha = 1) {
    output.x = Math.cos(angle) * radius;
    output.y = Math.sin(angle) * radius;
    output.alpha = alpha;
    return output;
  }

  function createMirrorGeometry() {
    return {
      id: &#x27;mirror&#x27;,
      name: &#x27;Mirror&#x27;,
      description: &#x27;Classic mirrored wedges. Legacy Mirror and Radial presets keep their original appearance here.&#x27;,
      settings: {
        cacheControls: [&#x27;segments&#x27;, &#x27;rotation&#x27;, &#x27;centerX&#x27;, &#x27;centerY&#x27;, &#x27;renderMode&#x27;, &#x27;mode&#x27;, &#x27;alternateMirror&#x27;, &#x27;circularCrop&#x27;],
        randomSegments: [2, 3, 4, 4, 6, 6, 8, 8, 10, 12, 16],
        randomizer: {
          weight: { subtle: 3, balanced: 4, wild: 3 },
          segments: { subtle: [2, 4, 4, 6, 6, 8], balanced: [2, 4, 4, 6, 6, 8, 8, 10, 12], wild: [2, 4, 6, 8, 10, 12, 16, 20, 24] },
          zoom: { subtle: [0.78, 1.28], balanced: [0.62, 1.62], wild: [0.42, 2.35] },
          denseAt: 14
        }
      },
      initialize() {},
      generateSegments({ width, height, settings }) {
        const center = getGeometryCenter(width, height, settings);
        const isLegacyRadial = settings.renderMode === &#x27;radial&#x27;;
        return {
          width,
          height,
          center,
          isLegacyRadial,
          span: (Math.PI * 2) / settings.segments,
          rotation: settings.rotation * Math.PI / 180,
          maxRadius: isLegacyRadial
            ? getRadialMaxRadius(center, width, height)
            : Math.hypot(center.x, center.y),
          cropRadius: Math.min(width, height) / 2
        };
      },
      transformSegment(x, y, plan, settings, output) {
        const dx = x - plan.center.x;
        const dy = y - plan.center.y;
        const distance = Math.hypot(dx, dy);
        if (plan.isLegacyRadial &amp;&amp; settings.circularCrop &amp;&amp; distance &gt; plan.cropRadius) {
          output.alpha = 0;
          return output;
        }
        const halfSpan = plan.span / 2;
        const theta = mod(Math.atan2(dy, dx) - plan.rotation, Math.PI * 2);
        const segmentIndex = Math.floor(theta / plan.span);
        let local = theta - segmentIndex * plan.span;
        if (plan.isLegacyRadial) {
          if (settings.alternateMirror &amp;&amp; segmentIndex % 2 === 1) local = plan.span - local;
        } else if (settings.mode === &#x27;alternating&#x27; &amp;&amp; segmentIndex % 2 === 1) {
          local = plan.span - local;
        } else if (settings.mode === &#x27;left&#x27;) {
          local = local &gt; halfSpan ? plan.span - local : local;
        } else if (settings.mode === &#x27;right&#x27;) {
          local = local &lt; halfSpan ? plan.span - local : local;
        } else if (settings.mode === &#x27;pinwheel&#x27;) {
          local = segmentIndex % 2 === 1 ? plan.span - local : local + halfSpan;
        }
        return setPolarMapping(output, distance / plan.maxRadius, local - halfSpan);
      },
      dispose() {}
    };
  }

        randomSegments: [3, 6, 6, 9, 12, 15],
        randomizer: {
          weight: { subtle: 2, balanced: 3, wild: 3 },
          segments: { subtle: [3, 6, 6, 9], balanced: [3, 6, 6, 9, 9, 12], wild: [3, 6, 9, 12, 15, 18] },
          zoom: { subtle: [0.82, 1.24], balanced: [0.72, 1.48], wild: [0.5, 1.95] },
          denseAt: 13
        }
      },
      initialize() {},
      generateSegments({ width, height, settings }) {
        const center = getGeometryCenter(width, height, settings);
        const rotation = settings.rotation * Math.PI / 180;
        return {
          width,
          height,
          center,
          maxRadius: getRadialMaxRadius(center, width, height),
          cos: Math.cos(rotation),
          sin: Math.sin(rotation),
          cell: clamp(3.2 / settings.segments, 0.12, 0.72)
        };
      },
      transformSegment(x, y, plan, settings, output) {
        if (isOutsideGeometryCrop(x, y, plan, settings)) {
          output.alpha = 0;
          return output;
        }
        const dx = (x - plan.center.x) / plan.maxRadius;
        const dy = (y - plan.center.y) / plan.maxRadius;
        const rx = dx * plan.cos - dy * plan.sin;
        const ry = dx * plan.sin + dy * plan.cos;
        const rowHeight = plan.cell * 0.8660254;
        const row = Math.floor(ry / rowHeight);
        let u = mod(rx + (row % 2) * plan.cell / 2 + plan.cell / 2, plan.cell) - plan.cell / 2;
        let v = mod(ry + rowHeight / 2, rowHeight) - rowHeight / 2;
        if ((row + Math.floor(rx / plan.cell)) % 2) u = -u;
        if (Math.abs(u) / (plan.cell / 2) + Math.abs(v) / rowHeight &gt; 1) {
          u = Math.sign(u || 1) * (plan.cell / 2 - Math.abs(v) * 0.5);
          v = -v;
        }
        output.x = clamp(u * 2.8 / plan.cell, -1, 1);
        output.y = clamp(v * 2.2 / rowHeight, -1, 1);
        output.alpha = 1;
        return output;
      },
      dispose() {}
    };
  }

  class GeometryManager {
    constructor(geometries = []) {
      this.geometries = new Map();
      this.activeId = null;
      this.planCache = new Map();
      this.context = null;
      geometries.forEach((geometry) =&gt; this.register(geometry));

          if (data[index + 3] === 0) {

            data[index + 1] = 0;
            data[index + 2] = 0;
            continue;
          }
          callback(data, index, x, y, width, height);
          data[index] = clamp(Math.round(data[index]), 0, 255);
          data[index + 1] = clamp(Math.round(data[index + 1]), 0, 255);
          data[index + 2] = clamp(Math.round(data[index + 2]), 0, 255);
        }
      }
      return imageData;
    }

    applyBrightness(imageData, settings) {
      const amount = settings.amount * 2.55;
      return this.mapPixels(imageData, (data, index) =&gt; {
        data[index] += amount; data[index + 1] += amount; data[index + 2] += amount;
      });
    }

    applyContrast(imageData, settings) {
      const factor = (100 + settings.amount) / 100;
      return this.mapPixels(imageData, (data, index) =&gt; {
        data[index] = (data[index] - 128) * factor + 128;
        data[index + 1] = (data[index + 1] - 128) * factor + 128;
        data[index + 2] = (data[index + 2] - 128) * factor + 128;
      });
    }

    applySaturation(imageData, settings) {
      const factor = 1 + settings.amount / 100;
      return this.mapPixels(imageData, (data, index) =&gt; {
        const gray = data[index] * 0.2126 + data[index + 1] * 0.7152 + data[index + 2] * 0.0722;
        data[index] = gray + (data[index] - gray) * factor;
        data[index + 1] = gray + (data[index + 1] - gray) * factor;
        data[index + 2] = gray + (data[index + 2] - gray) * factor;
      });
    }

    applyMonochrome(imageData) {
      return this.mapPixels(imageData, (data, index) =&gt; {
        const gray = data[index] * 0.2126 + data[index + 1] * 0.7152 + data[index + 2] * 0.0722;
        data[index] = gray; data[index + 1] = gray; data[index + 2] = gray;
      });
    }

    applyGlow(imageData, settings) {
      const amount = settings.amount / 100;
      return this.mapPixels(imageData, (data, index) =&gt; {
        const gray = data[index] * 0.2126 + data[index + 1] * 0.7152 + data[index + 2] * 0.0722;
        const highlight = clamp((gray - 140) / 115, 0, 1);
        const mix = highlight * amount * 0.24;
        data[index] += (255 - data[index]) * mix;
        data[index + 1] += (255 - data[index + 1]) * mix;
        data[index + 2] += (255 - data[index + 2]) * mix;
      });
    }

    applyVignette(imageData, settings) {
      const amount = settings.amount / 100;
      const diagonal = Math.sqrt(2);
      return this.mapPixels(imageData, (data, index, x, y, width, height) =&gt; {
        const normalizedX = width &gt; 1 ? (x / (width - 1)) * 2 - 1 : 0;
        const normalizedY = height &gt; 1 ? (y / (height - 1)) * 2 - 1 : 0;
        const distance = Math.sqrt(normalizedX * normalizedX + normalizedY * normalizedY) / diagonal;
        const edge = clamp((distance - 0.42) / 0.58, 0, 1);
        const factor = 1 - edge * amount * 0.88;
        data[index] *= factor; data[index + 1] *= factor; data[index + 2] *= factor;
      });
    }

    applyGrain(imageData, settings) {
      const amount = settings.amount * 0.35;
      return this.mapPixels(imageData, (data, index, x, y) =&gt; {
        const grain = this.noise(x, y) * amount;
        data[index] += grain; data[index + 1] += grain; data[index + 2] += grain;
      });
    }

    applyGradientMap(imageData, settings) {
      const gradientA = this.parseColor(settings.colorA, defaultEffects.gradientColorA);
      const gradientB = this.parseColor(settings.colorB, defaultEffects.gradientColorB);
      return this.mapPixels(imageData, (data, index) =&gt; {
        const mapValue = clamp((data[index] * 0.2126 + data[index + 1] * 0.7152 + data[index + 2] * 0.0722) / 255, 0, 1);
        data[index] = gradientA[0] + (gradientB[0] - gradientA[0]) * mapValue;
        data[index + 1] = gradientA[1] + (gradientB[1] - gradientA[1]) * mapValue;
        data[index + 2] = gradientA[2] + (gradientB[2] - gradientA[2]) * mapValue;
      });
    }

    apply(imageData, settings) {
      const stack = Array.isArray(settings.effectStack) ? settings.effectStack : migrateLegacyEffects(settings.effects);
      if (!stack.length) return imageData;
      stack.forEach((entry) =&gt; {
        const definition = effectDefinitions[entry.type];
        if (!definition || entry.enabled === false) return;
        const normalized = definition.normalize(entry.settings || {});
        if (definition.isNeutral(normalized)) return;
        definition.apply(this, imageData, normalized);
      });
      return imageData;
    }

    applyToContext(targetContext, width, height, settings) {
      const imageData = targetContext.getImageData(0, 0, width, height);
      targetContext.putImageData(this.apply(imageData, settings), 0, 0);
    }
  }

  const postProcessingPipeline = new PostProcessingPipeline();

  function createMirrorLayer() {
    return {
      id: &#x27;mirror&#x27;,
      type: &#x27;symmetry&#x27;,
      enabled: mirrorLayerInput.checked,
      settings: { renderMode: &#x27;mirror&#x27; },
      initialize() {},
      isApplicable(settings) { return settings.renderMode === &#x27;mirror&#x27;; },
      render({ input, width, height, settings, context }) {
        return geometryManager.render(context, width, height, input, settings);
      },
      dispose() {}
    };
  }

  function createRadialLayer() {
    return {
      id: &#x27;radial&#x27;,
      type: &#x27;symmetry&#x27;,
      enabled: radialLayerInput.checked,
      settings: { renderMode: &#x27;radial&#x27; },
      initialize() {},
      isApplicable(settings) { return settings.renderMode === &#x27;radial&#x27;; },
      render({ input, width, height, settings, context }) {
        return geometryManager.render(context, width, height, input, settings);
      },
      dispose() {}
    };
  }

  const layerManager = new LayerManager([createMirrorLayer(), createRadialLayer()]);

  function drawSourceFallback(targetContext, width, height, source) {
    targetContext.clearRect(0, 0, width, height);
    const scale = Math.min(width / source.width, height / source.height);
    const drawWidth = source.width * scale;
    const drawHeight = source.height * scale;
    targetContext.drawImage(source.canvas, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
  }

  function drawActiveRenderer(targetContext, width, height, source, settings = getRenderableState()) {
    const rendered = layerManager.render(targetContext, width, height, source, settings);
    if (!rendered) {
      drawSourceFallback(targetContext, width, height, source);
      const fallbackPixels = targetContext.getImageData(0, 0, width, height);
      const crystalPixels = crystalModeStage.apply(polarEngine.apply(fallbackPixels, settings), settings);
      targetContext.putImageData(postProcessingPipeline.apply(sacredGeometryStage.apply(crystalPixels, settings), settings), 0, 0);
    }
  }

  function renderKaleidoscope() {
    syncNumberInputs();
    if (paintingMode) syncPaintingPixels();
    const settings = getRenderableState();
    syncOpticalAperture(settings);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!hasActiveSource()) {
      empty.style.display = &#x27;grid&#x27;;
      drawSourceNavigator();
      return;
    }
    empty.style.display = &#x27;none&#x27;;
    updateCenterHandle();
    drawSourceNavigator();
    if (showingOriginal) {
      const originalSource = paintingMode &amp;&amp; importedPreviewSource ? importedPreviewSource : previewSource;
      const scale = Math.min(canvas.width / originalSource.width, canvas.height / originalSource.height);
      const width = originalSource.width * scale;
      const height = originalSource.height * scale;
      ctx.drawImage(originalSource.canvas, (canvas.width - width) / 2, (canvas.height - height) / 2, width, height);
      return;
    }
    drawActiveRenderer(ctx, canvas.width, canvas.height, previewSource, settings);
    sacredGeometryStage.drawGuide(ctx, canvas.width, canvas.height, settings.pattern);
  }

  function favoriteDataUrl(canvas, type = &#x27;image/webp&#x27;, quality = 0.76) {
    try {
      const encoded = canvas.toDataURL(type, quality);
      return encoded.startsWith(&#x27;data:image/&#x27;) ? encoded : canvas.toDataURL(&#x27;image/png&#x27;);
    } catch (error) {
      return canvas.toDataURL(&#x27;image/png&#x27;);
    }
  }

  function createUnrotatedSourceData(image, maxSourceSide = favoriteSourceLimit) {
    const sourceWidth = image.width || image.naturalWidth;
    const sourceHeight = image.height || image.naturalHeight;
    const scale = Math.min(1, maxSourceSide / Math.max(sourceWidth, sourceHeight));
    const sourceCanvas = document.createElement(&#x27;canvas&#x27;);
    sourceCanvas.width = Math.max(1, Math.round(sourceWidth * scale));
    sourceCanvas.height = Math.max(1, Math.round(sourceHeight * scale));
    const sourceContext = sourceCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });
    sourceContext.drawImage(image, 0, 0, sourceCanvas.width, sourceCanvas.height);
    return {
      canvas: sourceCanvas,
      pixels: sourceContext.getImageData(0, 0, sourceCanvas.width, sourceCanvas.height).data,
      width: sourceCanvas.width,
      height: sourceCanvas.height
    };
  }

  function createFavoriteSourceSnapshot() {
    if (paintingMode &amp;&amp; paintingSource) {
      const sourceCanvas = document.createElement(&#x27;canvas&#x27;);
      const scale = Math.min(1, favoriteSourceLimit / Math.max(paintingSource.width, paintingSource.height));
      sourceCanvas.width = Math.max(1, Math.round(paintingSource.width * scale));
      sourceCanvas.height = Math.max(1, Math.round(paintingSource.height * scale));
      sourceCanvas.getContext(&#x27;2d&#x27;).drawImage(paintingSource.canvas, 0, 0, sourceCanvas.width, sourceCanvas.height);
      return { dataUrl: favoriteDataUrl(sourceCanvas), paintingSnapshot: true };
    }
    if (!sourceImage) return null;
    const source = createUnrotatedSourceData(sourceImage);
    return { dataUrl: favoriteDataUrl(source.canvas), paintingSnapshot: false };
  }

  function getDefaultProjectState() {
    return {
      segments: 2,
      rotation: 0,
      zoom: 1,
      offsetX: 0,
      offsetY: 0,
      centerX: 0,
      centerY: 0,
      circularCrop: false,
      alternateMirror: true,
      mirrorLayerEnabled: true,
      radialLayerEnabled: true,
      mode: &#x27;alternating&#x27;,
      renderMode: &#x27;mirror&#x27;,
      geometryId: &#x27;mirror&#x27;,
      polar: { ...defaultPolar },
      crystal: { ...defaultCrystal },
      pattern: { ...defaultPattern },
      animation: normalizeAnimationState(defaultAnimation),
      effectStack: []
    };
  }

  function normalizeProjectState(state) {
    const source = state &amp;&amp; typeof state === &#x27;object&#x27; &amp;&amp; !Array.isArray(state) ? state : {};
    const defaults = getDefaultProjectState();
    const controls = {
      segments: pairedControls[0],
      rotation: rotationControl,
      zoom: zoomControl,
      offsetX: offsetXControl,
      offsetY: offsetYControl,
      centerX: centerXControl,
      centerY: centerYControl
    };
    const normalized = { ...defaults };
    Object.entries(controls).forEach(([key, control]) =&gt; {
      const value = Number.isFinite(Number(source[key])) ? Number(source[key]) : defaults[key];
      normalized[key] = normalizeControlValue(control, value);
    });
    normalized.circularCrop = source.circularCrop === true;
    normalized.alternateMirror = source.alternateMirror !== false;
    normalized.mirrorLayerEnabled = source.mirrorLayerEnabled !== false;
    normalized.radialLayerEnabled = source.radialLayerEnabled !== false;
    normalized.mode = [&#x27;alternating&#x27;, &#x27;left&#x27;, &#x27;right&#x27;, &#x27;pinwheel&#x27;].includes(source.mode) ? source.mode : defaults.mode;
    normalized.renderMode = source.renderMode === &#x27;radial&#x27; ? &#x27;radial&#x27; : defaults.renderMode;
    normalized.geometryId = geometryManager.has(source.geometryId) ? source.geometryId : defaults.geometryId;
    normalized.polar = { ...defaultPolar, ...(source.polar &amp;&amp; typeof source.polar === &#x27;object&#x27; ? source.polar : {}) };
    normalized.crystal = { ...defaultCrystal, ...(source.crystal &amp;&amp; typeof source.crystal === &#x27;object&#x27; ? source.crystal : {}) };
    normalized.pattern = { ...defaultPattern, ...(source.pattern &amp;&amp; typeof source.pattern === &#x27;object&#x27; ? source.pattern : {}) };
    normalized.animation = normalizeAnimationState(source.animation || defaultAnimation);
    normalized.effectStack = Array.isArray(source.effectStack)
      ? normalizeEffectStack(source.effectStack)
      : migrateLegacyEffects(source.effects);
    return normalized;
  }

  function createProjectPayload() {
    if (!hasActiveSource()) throw new Error(&#x27;Open an image or create a blank canvas before saving a project.&#x27;);
    const sourceSnapshot = createFavoriteSourceSnapshot();
    if (!sourceSnapshot?.dataUrl) throw new Error(&#x27;The current source could not be embedded safely in a project file.&#x27;);
    return {
      format: &#x27;kaleidoscope-image-lab-project&#x27;,
      version: 1,
      name: sanitizeExportName(exportNameInput.value || &#x27;kaleidoscope-project&#x27;),
      source: {
        type: sourceSnapshot.paintingSnapshot ? &#x27;painted-source&#x27; : &#x27;imported-image&#x27;,
        dataUrl: sourceSnapshot.dataUrl
      },
      state: getState()
    };
  }

  async function saveProject() {
    setError(&#x27;&#x27;);
    try {
      const project = createProjectPayload();
      const blob = new Blob([JSON.stringify(project, null, 2)], { type: &#x27;application/json&#x27; });
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement(&#x27;a&#x27;);
      link.href = objectUrl;
      link.download = &#x27;kaleidoscope-project.kilab.json&#x27;;
      link.click();
      window.setTimeout(() =&gt; URL.revokeObjectURL(objectUrl), 1000);
      projectStatus.textContent = &#x27;Project saved. The current composition and history are unchanged.&#x27;;
    } catch (saveError) {
      projectStatus.textContent = saveError.message || &#x27;Project could not be saved.&#x27;;
      setError(projectStatus.textContent);
    }
  }

  function validateProjectPayload(project) {
    if (!project || typeof project !== &#x27;object&#x27; || Array.isArray(project) || project.format !== &#x27;kaleidoscope-image-lab-project&#x27; || project.version !== 1) {
      throw new Error(&#x27;Invalid project file: expected Kaleidoscope Image Lab format version 1.&#x27;);
    }
    if (!project.state || typeof project.state !== &#x27;object&#x27; || Array.isArray(project.state)) {
      throw new Error(&#x27;Invalid project file: the required composition state is missing.&#x27;);
    }
    if (!project.source || ![&#x27;imported-image&#x27;, &#x27;painted-source&#x27;].includes(project.source.type) || typeof project.source.dataUrl !== &#x27;string&#x27; || !project.source.dataUrl.startsWith(&#x27;data:image/&#x27;)) {
      throw new Error(&#x27;Invalid project file: the required source snapshot is missing or unsupported.&#x27;);
    }
  }

  async function openProject(file) {
    if (!file) return;
    setError(&#x27;&#x27;);
    projectStatus.textContent = &#x27;Opening project…&#x27;;
    try {
      const project = JSON.parse(await file.text());
      validateProjectPayload(project);
      const state = normalizeProjectState(project.state);
      const image = await loadFavoriteImage(project.source.dataUrl);
      stopAnimation();
      if (sourceImage &amp;&amp; typeof sourceImage.close === &#x27;function&#x27;) sourceImage.close();
      if (project.source.type === &#x27;painted-source&#x27;) {
        const source = createUnrotatedSourceData(image, favoriteSourceLimit);
        sourceImage = null;
        importedPreviewSource = null;
        paintingSource = createPaintingSource(source);
        paintingMode = true;
        previewSource = paintingSource;
      } else {
        sourceImage = image;
        importedPreviewSource = null;
        paintingSource = null;
        paintingMode = false;
        paintingDrag = null;
        drawCoverImage();
      }
      drag = null;
      wheelStartState = null;
      window.clearTimeout(wheelCommitTimer);
      wheelCommitTimer = 0;
      fileName.textContent = `Project · ${project.name || &#x27;Untitled&#x27;}`;
      exportNameInput.value = getDefaultExportName(project.name || &#x27;kaleidoscope-project&#x27;);
      exportWidthInput.value = String(canvas.width);
      exportHeightInput.value = String(canvas.height);
      syncCustomAspectRatio();
      setOriginalPreview(false);
      clearDiscoveryBatch();
      applyState(state);
      updatePaintingUi();
      drawSourceNavigator();
      resetHistory();
      updateFavoritesAvailability();
      requestRender();
      projectStatus.textContent = &#x27;Project opened. Animation settings were restored without autoplay.&#x27;;
    } catch (openError) {
      projectStatus.textContent = openError.message || &#x27;Project could not be opened.&#x27;;
      setError(projectStatus.textContent);
    } finally {
      projectFileInput.value = &#x27;&#x27;;
    }
  }

  function createNewProject() {
    stopAnimation();
    if (sourceImage &amp;&amp; typeof sourceImage.close === &#x27;function&#x27;) sourceImage.close();
    sourceImage = null;
    importedPreviewSource = null;
    previewSource = null;
    paintingSource = null;
    paintingMode = false;
    paintingDrag = null;

  function requestNewProject() {

  function createFavoriteThumbnail(settings) {
    const thumbnailCanvas = document.createElement(&#x27;canvas&#x27;);
    thumbnailCanvas.width = favoriteThumbnailSize;
    thumbnailCanvas.height = favoriteThumbnailSize;
    const thumbnailContext = thumbnailCanvas.getContext(&#x27;2d&#x27;);
    thumbnailContext.fillStyle = &#x27;#0b1011&#x27;;
    thumbnailContext.fillRect(0, 0, favoriteThumbnailSize, favoriteThumbnailSize);
    drawActiveRenderer(thumbnailContext, favoriteThumbnailSize, favoriteThumbnailSize, previewSource, settings);
    if (settings.pattern &amp;&amp; patternGuideInput.checked) {

  function normalizeFavoriteRecord(record) {

  }

  function readFavorites() {
    try {
      const stored = window.localStorage.getItem(favoriteStorageKey);
      if (!stored) return [];
      const parsed = JSON.parse(stored);

      return parsed.map(normalizeFavoriteRecord).filter(Boolean).slice(0, favoriteLimit);

  function addFavorite() {
    if (!hasActiveSource() || favorites.length &gt;= favoriteLimit) return;
    try {
      const sourceSnapshot = createFavoriteSourceSnapshot();

      const state = getState();
      const thumbnail = createFavoriteThumbnail(getRenderableState());
      const favorite = {
